<div x-data="dashboardPage()" x-init="init()" class="space-y-4">

  <!-- Stat cards -->
  <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
    <div class="bg-gray-800 rounded-lg p-4 border border-gray-700">
      <p class="text-xs text-gray-500">Tenants</p>
      <p class="text-2xl font-bold text-blue-400" x-text="stats.tenants"></p>
    </div>
    <div class="bg-gray-800 rounded-lg p-4 border border-gray-700">
      <p class="text-xs text-gray-500">Παραστατικά</p>
      <p class="text-2xl font-bold text-green-400" x-text="stats.invoices"></p>
    </div>
    <div class="bg-gray-800 rounded-lg p-4 border border-gray-700">
      <p class="text-xs text-gray-500">Χρήστες</p>
      <p class="text-2xl font-bold text-amber-400" x-text="stats.users"></p>
    </div>
    <div class="bg-gray-800 rounded-lg p-4 border border-gray-700">
      <p class="text-xs text-gray-500">Περίμενουν έγκριση</p>
      <p class="text-2xl font-bold text-purple-400" x-text="stats.pending"></p>
    </div>
  </div>

  <!-- Low credit alerts -->
  <div x-show="lowCredit.length" class="bg-amber-950/40 border border-amber-800 rounded-lg p-4">
    <h4 class="text-xs font-bold text-amber-300 uppercase mb-2">⚠ Χαμηλά Credits</h4>
    <ul class="text-xs text-amber-200 space-y-1">
      <template x-for="lc in lowCredit" :key="lc.tenant.id">
        <li>• <span x-text="lc.tenant.company_name"></span> (<span x-text="lc.tenant.vat_number"></span>) — <span x-text="lc.balance"></span> credits</li>
      </template>
    </ul>
  </div>

  <!-- Recent invoices -->
  <div class="bg-gray-800 rounded-lg border border-gray-700">
    <div class="flex items-center justify-between p-4 border-b border-gray-700">
      <h4 class="text-xs font-bold text-gray-400 uppercase">Πρόφατα Παραστατικά</h4>
      <a href="#" @click.prevent="window.navigate('/invoices')" class="text-xs text-blue-400 hover:text-blue-300">Όλα →</a>
    </div>
    <table class="w-full text-xs">
      <thead>
        <tr class="text-gray-500 border-b border-gray-700">
          <th class="text-left px-4 py-2">Σειρά/ΑΑ</th>
          <th class="text-left px-4 py-2">Εκδότης</th>
          <th class="text-left px-4 py-2">Λήπτης</th>
          <th class="text-right px-4 py-2">Σύνολο</th>
          <th class="text-center px-4 py-2">Status</th>
        </tr>
      </thead>
      <tbody>
        <template x-for="inv in recentInvoices" :key="inv.id">
          <tr class="border-b border-gray-700/50 hover:bg-gray-700/20">
            <td class="px-4 py-2 font-mono" x-text="(inv.series||'') + '/' + inv.aa"></td>
            <td class="px-4 py-2" x-text="inv.issuer_vat"></td>
            <td class="px-4 py-2" x-text="inv.counterpart_vat || '—'"></td>
            <td class="px-4 py-2 text-right" x-text="'€' + formatNumber(inv.total_gross)"></td>
            <td class="px-4 py-2 text-center">
              <span :class="{
                'SENT': 'bg-green-900/60 text-green-300',
                'FAILED': 'bg-red-900/60 text-red-300',
                'DRAFT': 'bg-amber-900/60 text-amber-300',
              }[inv.status] || 'bg-gray-700 text-gray-300'" class="px-2 py-0.5 rounded text-[10px] font-medium" x-text="inv.status"></span>
            </td>
          </tr>
        </template>
        <tr x-show="recentInvoices.length === 0">
          <td colspan="5" class="px-4 py-6 text-center text-gray-500">Κανένα παραστατικό</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
