<div x-data="resellersPage()" x-init="init()" class="space-y-4">

  <div class="flex items-center justify-between">
    <p class="text-xs text-gray-500" x-text="resellers.length + ' resellers'"></p>
    <button @click="showModal = true" class="text-xs bg-blue-600 hover:bg-blue-500 px-3 py-1.5 rounded">+ Νέος Reseller</button>
  </div>

  <div class="bg-gray-800 rounded-lg border border-gray-700 overflow-x-auto">
    <table class="w-full text-xs">
      <thead>
        <tr class="text-gray-500 border-b border-gray-700">
          <th class="text-left px-4 py-2">Name</th>
          <th class="text-left px-4 py-2">ΑΦΜ</th>
          <th class="text-left px-4 py-2">Email</th>
          <th class="text-center px-4 py-2">Commission %</th>
          <th class="text-center px-4 py-2">Status</th>
          <th class="text-center px-4 py-2"></th>
        </tr>
      </thead>
      <tbody>
        <template x-for="r in resellers" :key="r.id">
          <tr class="border-b border-gray-700/50 hover:bg-gray-700/20">
            <td class="px-4 py-2 font-medium" x-text="r.name"></td>
            <td class="px-4 py-2 font-mono" x-text="r.vat_number"></td>
            <td class="px-4 py-2" x-text="r.email"></td>
            <td class="px-4 py-2 text-center" x-text="r.commission_rate + '%'"></td>
            <td class="px-4 py-2 text-center">
              <span :class="r.is_active ? 'text-green-400' : 'text-red-400'" x-text="r.is_active ? 'Active' : 'Inactive'"></span>
            </td>
            <td class="px-4 py-2 text-center">
              <button @click="edit(r)" class="text-blue-400 hover:text-blue-300 mr-2">Edit</button>
              <button @click="remove(r.id)" class="text-red-400 hover:text-red-300">Delete</button>
            </td>
          </tr>
        </template>
        <tr x-show="resellers.length === 0">
          <td colspan="6" class="px-4 py-6 text-center text-gray-500">Κανένας reseller</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Create modal -->
  <div x-show="showModal" @click="showModal = false" class="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4" x-cloak>
    <div @click.stop class="bg-gray-800 rounded-xl border border-gray-700 p-5 max-w-md w-full">
      <h4 class="font-bold text-sm mb-4" x-text="editingId ? 'Επεξεργασία Reseller' : 'Νέος Reseller'"></h4>
      <div class="space-y-3">
        <div>
          <label class="block text-[11px] text-gray-500 mb-1">Name *</label>
          <input x-model="form.name" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-[11px] text-gray-500 mb-1">ΑΦΜ *</label>
            <input x-model="form.vat_number" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm">
          </div>
          <div>
            <label class="block text-[11px] text-gray-500 mb-1">Email *</label>
            <input x-model="form.email" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm">
          </div>
        </div>
        <div>
          <label class="block text-[11px] text-gray-500 mb-1">Commission Rate (%)</label>
          <input type="number" min="0" max="100" x-model.number="form.commission_rate" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm">
        </div>
        <label x-show="editingId" class="flex items-center gap-2 text-xs text-gray-400"><input type="checkbox" x-model="form.is_active"> Ενεργός</label>
      </div>
      <div class="flex justify-end gap-2 mt-4">
        <button @click="showModal = false" class="text-xs bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded">Ακύρωση</button>
        <button @click="create()" class="text-xs bg-blue-600 hover:bg-blue-500 px-3 py-1.5 rounded" x-text="editingId ? 'Αποθήκευση' : 'Δημιουργία'"></button>
      </div>
    </div>
  </div>
</div>
