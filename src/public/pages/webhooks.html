<div x-data="webhooksPage()" x-init="init()" class="space-y-4">

  <!-- Tenant selector + add -->
  <div class="flex items-center gap-3">
    <label class="text-xs text-gray-500">Tenant:</label>
    <select x-model="selectedTenantId" @change="load()" class="bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm">
      <template x-for="t in tenants" :key="t.id">
        <option :value="t.id" x-text="t.company_name"></option>
      </template>
    </select>
    <button @click="showModal = true" class="text-xs bg-blue-600 hover:bg-blue-500 px-3 py-1.5 rounded ml-auto">+ Νέο Webhook</button>
  </div>

  <!-- Webhooks table -->
  <div class="bg-gray-800 rounded-lg border border-gray-700 overflow-x-auto">
    <table class="w-full text-xs">
      <thead>
        <tr class="text-gray-500 border-b border-gray-700">
          <th class="text-left px-4 py-2">URL</th>
          <th class="text-left px-4 py-2">Events</th>
          <th class="text-center px-4 py-2">Status</th>
          <th class="text-center px-4 py-2"></th>
        </tr>
      </thead>
      <tbody>
        <template x-for="w in webhooks" :key="w.id">
          <tr class="border-b border-gray-700/50 hover:bg-gray-700/20">
            <td class="px-4 py-2 font-mono text-[11px]" x-text="w.url"></td>
            <td class="px-4 py-2">
              <span x-text="typeof w.events === 'string' ? w.events : JSON.stringify(w.events)"></span>
            </td>
            <td class="px-4 py-2 text-center">
              <span :class="w.is_active ? 'text-green-400' : 'text-red-400'" x-text="w.is_active ? 'Active' : 'Inactive'"></span>
            </td>
            <td class="px-4 py-2 text-center">
              <button @click="remove(w.id)" class="text-red-400 hover:text-red-300">Delete</button>
            </td>
          </tr>
        </template>
        <tr x-show="webhooks.length === 0">
          <td colspan="4" class="px-4 py-6 text-center text-gray-500">Κανένα webhook</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Create modal -->
  <div x-show="showModal" @click="showModal = false" class="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4" x-cloak>
    <div @click.stop class="bg-gray-800 rounded-xl border border-gray-700 p-5 max-w-md w-full">
      <h4 class="font-bold text-sm mb-4">Νέο Webhook Endpoint</h4>
      <div class="space-y-3">
        <div>
          <label class="block text-[11px] text-gray-500 mb-1">URL *</label>
          <input x-model="form.url" placeholder="https://example.com/webhook" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm">
        </div>
        <div>
          <label class="block text-[11px] text-gray-500 mb-1">Secret (HMAC-SHA256)</label>
          <input x-model="form.secret" placeholder="αυτόματο αν κενό" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm">
        </div>
        <div>
          <label class="block text-[11px] text-gray-500 mb-1">Events (comma-separated)</label>
          <input x-model="form.events" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-sm">
        </div>
      </div>
      <div class="flex justify-end gap-2 mt-4">
        <button @click="showModal = false" class="text-xs bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded">Ακύρωση</button>
        <button @click="create()" class="text-xs bg-blue-600 hover:bg-blue-500 px-3 py-1.5 rounded">Δημιουργία</button>
      </div>
    </div>
  </div>
</div>
