<div x-data="settingsPage()" x-init="init()" class="space-y-4">

  <div class="bg-gray-800 rounded-lg border border-gray-700 p-5">
    <h4 class="text-xs font-bold text-gray-400 uppercase mb-4">AADE Config</h4>
    <div class="grid grid-cols-2 gap-4 text-sm">
      <div class="flex justify-between py-2 border-b border-gray-700">
        <span class="text-gray-500">Mode</span>
        <span :class="config?.isMock ? 'text-amber-400' : 'text-green-400'" x-text="config?.isMock ? 'Mock Mode' : 'Live (Sandbox)'"></span>
      </div>
      <div class="flex justify-between py-2 border-b border-gray-700">
        <span class="text-gray-500">API URL</span>
        <span class="font-mono text-xs" x-text="config?.apiUrl || '—'"></span>
      </div>
      <div class="flex justify-between py-2 border-b border-gray-700">
        <span class="text-gray-500">User ID set</span>
        <span :class="config?.userId ? 'text-green-400' : 'text-red-400'" x-text="config?.userId ? '✓' : '✗'"></span>
      </div>
      <div class="flex justify-between py-2 border-b border-gray-700">
        <span class="text-gray-500">Subscription Key set</span>
        <span :class="config?.subscriptionKey ? 'text-green-400' : 'text-red-400'" x-text="config?.subscriptionKey ? '✓ (hidden)' : '✗'"></span>
      </div>
      <div class="flex justify-between py-2 border-b border-gray-700 col-span-2">
        <span class="text-gray-500">QR Base URL</span>
        <span class="font-mono text-xs" x-text="config?.qrBaseUrl || '—'"></span>
      </div>
    </div>
    <p class="text-[11px] text-gray-500 mt-4">Τα credentials φορτώνονται από το αρχείο <code class="bg-gray-700 px-1 rounded">.env</code>. Αλλαγή απαιτεί επανεκκίνηση του server.</p>
  </div>

  <div class="bg-gray-800 rounded-lg border border-gray-700 p-5">
    <h4 class="text-xs font-bold text-gray-400 uppercase mb-3">Δοκιμή Σύνδεσης</h4>
    <button @click="pingHealthz()" class="text-xs bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded">Ping /healthz</button>
  </div>
</div>
