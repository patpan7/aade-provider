version: '3.8'

services:
  aade-provider:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aade-provider
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - db_data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  db_data:
